{% extends 'base.html' %}

{% block title %}Register - EduLearn{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-8">
            <!-- Logo -->
            <div class="text-center mb-8">
                <a href="/" class="inline-flex items-center space-x-2">
                    <i class="fas fa-graduation-cap text-4xl text-indigo-600"></i>
                    <span class="text-2xl font-bold">EduLearn</span>
                </a>
                <h2 class="text-3xl font-bold mt-6">Create your account</h2>
                <p class="text-gray-600 dark:text-gray-400 mt-2">
                    Already have an account? <a href="{% url 'users:login' %}" class="text-indigo-600 hover:text-indigo-700">Sign in</a>
                </p>
            </div>

            <!-- Register Form -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="first_name" class="block text-sm font-medium mb-2">First Name</label>
                        <input type="text" name="first_name" id="first_name" required 
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700">
                    </div>
                    <div>
                        <label for="last_name" class="block text-sm font-medium mb-2">Last Name</label>
                        <input type="text" name="last_name" id="last_name" required 
                               class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium mb-2">Email Address</label>
                    <input type="email" name="email" id="email" required 
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700"
                           placeholder="you@example.com">
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium mb-2">Username</label>
                    <input type="text" name="username" id="username" required 
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700">
                </div>

                <div>
                    <label for="role" class="block text-sm font-medium mb-2">I want to</label>
                    <select name="role" id="role" 
                            class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700">
                        <option value="student">Learn new skills</option>
                        <option value="instructor">Teach courses</option>
                    </select>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" name="password" id="password" required 
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700">
                    <p class="text-xs text-gray-500 mt-1">At least 8 characters</p>
                </div>

                <div>
                    <label for="password2" class="block text-sm font-medium mb-2">Confirm Password</label>
                    <input type="password" name="password2" id="password2" required 
                           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" name="terms" id="terms" required 
                           class="h-4 w-4 text-indigo-600 border-gray-300 rounded">
                    <label for="terms" class="ml-2 text-sm">
                        I agree to the <a href="#" class="text-indigo-600 hover:text-indigo-700">Terms of Service</a> and <a href="#" class="text-indigo-600 hover:text-indigo-700">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" 
                        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition">
                    Create Account
                </button>
            </form>

            <!-- Divider -->
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white dark:bg-gray-800 text-gray-500">Or sign up with</span>
                    </div>
                </div>

                <!-- Social Signup -->
                <div class="mt-6 grid grid-cols-2 gap-4">
                    <a href="/accounts/google/login/" 
                       class="flex items-center justify-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                        <i class="fab fa-google text-red-500 mr-2"></i>
                        Google
                    </a>
                    <a href="/accounts/github/login/" 
                       class="flex items-center justify-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                        <i class="fab fa-github mr-2"></i>
                        GitHub
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
